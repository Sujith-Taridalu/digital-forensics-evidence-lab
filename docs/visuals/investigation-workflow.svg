<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="70" y="80" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Digital Forensics Investigation Workflow</text>
  <text x="70" y="118" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Sanitized overview of the evidence-driven forensic process</text>

  <rect x="70" y="170" rx="18" ry="18" width="240" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="100" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">1. Integrity Check</text>
  <text x="100" y="248" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Hash validation and</text>
  <text x="100" y="272" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">read-only handling</text>

  <rect x="350" y="170" rx="18" ry="18" width="240" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="383" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">2. Artifact Review</text>
  <text x="383" y="248" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Prefetch, browser,</text>
  <text x="383" y="272" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">user directories</text>

  <rect x="630" y="170" rx="18" ry="18" width="240" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="666" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">3. Comms Review</text>
  <text x="666" y="248" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Local chat/cache</text>
  <text x="666" y="272" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">and file exchange</text>

  <rect x="910" y="170" rx="18" ry="18" width="220" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="943" y="216" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">4. Correlation</text>
  <text x="943" y="248" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Cross-check tools,</text>
  <text x="943" y="272" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">files, and activity</text>

  <rect x="220" y="420" rx="18" ry="18" width="260" height="120" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="256" y="468" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">5. Timeline Build</text>
  <text x="256" y="502" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Relate events across</text>
  <text x="256" y="526" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">a common activity window</text>

  <rect x="530" y="420" rx="18" ry="18" width="260" height="120" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="564" y="468" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">6. Findings</text>
  <text x="564" y="502" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Summarize evidence,</text>
  <text x="564" y="526" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">limits, and next steps</text>

  <rect x="840" y="420" rx="18" ry="18" width="260" height="120" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="876" y="468" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700">7. Case Output</text>
  <text x="876" y="502" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Defensible report and</text>
  <text x="876" y="526" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">investigative narrative</text>

  <line x1="310" y1="225" x2="350" y2="225" stroke="#38bdf8" stroke-width="4"/>
  <polygon points="350,225 336,217 336,233" fill="#38bdf8"/>
  <line x1="590" y1="225" x2="630" y2="225" stroke="#38bdf8" stroke-width="4"/>
  <polygon points="630,225 616,217 616,233" fill="#38bdf8"/>
  <line x1="870" y1="225" x2="910" y2="225" stroke="#38bdf8" stroke-width="4"/>
  <polygon points="910,225 896,217 896,233" fill="#38bdf8"/>
  <line x1="1020" y1="280" x2="1020" y2="350" stroke="#64748b" stroke-width="4"/>
  <polygon points="1020,350 1012,336 1028,336" fill="#64748b"/>
  <line x1="1020" y1="350" x2="970" y2="420" stroke="#64748b" stroke-width="4"/>
  <polygon points="970,420 974,404 986,414" fill="#64748b"/>
  <line x1="840" y1="480" x2="790" y2="480" stroke="#22c55e" stroke-width="4"/>
  <polygon points="790,480 804,472 804,488" fill="#22c55e"/>
  <line x1="530" y1="480" x2="480" y2="480" stroke="#22c55e" stroke-width="4"/>
  <polygon points="480,480 494,472 494,488" fill="#22c55e"/>

  <rect x="70" y="610" rx="14" ry="14" width="1060" height="58" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="95" y="647" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Key theme: use artifact correlation and defensible process to move from isolated traces to an explainable investigative story.</text>
</svg>
