<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="PCAP analysis flow">
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="70" y="80" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">PCAP Network Forensics Flow</text>
  <text x="70" y="118" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Sanitized workflow for endpoint attribution, download analysis, and hash enrichment</text>

  <rect x="75" y="170" width="180" height="100" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="115" y="210" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">ARP</text>
  <text x="115" y="242" fill="#cbd5e1" font-family="Arial" font-size="16">IP to MAC</text>

  <rect x="305" y="170" width="180" height="100" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="345" y="210" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">DHCP</text>
  <text x="345" y="242" fill="#cbd5e1" font-family="Arial" font-size="16">Hostname</text>

  <rect x="535" y="170" width="180" height="100" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="575" y="210" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">Kerberos</text>
  <text x="575" y="242" fill="#cbd5e1" font-family="Arial" font-size="16">Account context</text>

  <rect x="765" y="170" width="180" height="100" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="805" y="210" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">HTTP</text>
  <text x="805" y="242" fill="#cbd5e1" font-family="Arial" font-size="16">Executable download</text>

  <rect x="535" y="410" width="250" height="115" rx="18" fill="#111827" stroke="#f43f5e" stroke-width="3"/>
  <text x="575" y="455" fill="#f8fafc" font-family="Arial" font-size="23" font-weight="700">SHA256 + Enrichment</text>
  <text x="575" y="490" fill="#cbd5e1" font-family="Arial" font-size="17">Hash-only IOC review</text>

  <rect x="830" y="410" width="250" height="115" rx="18" fill="#111827" stroke="#14b8a6" stroke-width="3"/>
  <text x="870" y="455" fill="#f8fafc" font-family="Arial" font-size="23" font-weight="700">Report Finding</text>
  <text x="870" y="490" fill="#cbd5e1" font-family="Arial" font-size="17">No raw PCAP or binary</text>

  <line x1="255" y1="220" x2="305" y2="220" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="485" y1="220" x2="535" y2="220" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="715" y1="220" x2="765" y2="220" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="855" y1="270" x2="690" y2="410" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="785" y1="467" x2="830" y2="467" stroke="#e5e7eb" stroke-width="4" marker-end="url(#arrowLight)"/>

  <rect x="95" y="610" width="1010" height="54" rx="14" fill="#020617" stroke="#334155"/>
  <text x="600" y="644" text-anchor="middle" fill="#e5e7eb" font-family="Arial" font-size="18">Key lesson: summarize protocol evidence and hash enrichment without publishing raw captures or executables.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#64748b"/></marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#e5e7eb"/></marker>
  </defs>
</svg>
